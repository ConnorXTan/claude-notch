name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the Swift package
        run: |
          swift build
          swift test
      - name: Bundle the app
        run: make app
